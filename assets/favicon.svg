<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Typing trainer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- dark rounded tile -->
  <rect width="128" height="128" rx="28" fill="#0b1220"/>
  <!-- keyboard body -->
  <rect x="18" y="42" width="92" height="58" rx="10" fill="#1e293b" stroke="url(#g)" stroke-width="4"/>
  <!-- keys row 1 -->
  <rect x="28" y="52" width="16" height="14" rx="3" fill="#334155"/>
  <rect x="48" y="52" width="16" height="14" rx="3" fill="#334155"/>
  <rect x="68" y="52" width="16" height="14" rx="3" fill="#22d3ee"/>
  <rect x="88" y="52" width="12" height="14" rx="3" fill="#334155"/>
  <!-- keys row 2 -->
  <rect x="28" y="70" width="16" height="14" rx="3" fill="#334155"/>
  <rect x="48" y="70" width="16" height="14" rx="3" fill="#34d399"/>
  <rect x="68" y="70" width="16" height="14" rx="3" fill="#334155"/>
  <rect x="88" y="70" width="12" height="14" rx="3" fill="#334155"/>
  <!-- spacebar -->
  <rect x="36" y="88" width="56" height="6" rx="3" fill="#475569"/>
  <!-- typing caret -->
  <rect x="74" y="22" width="8" height="28" rx="3" fill="#f8fafc"/>
  <rect x="74" y="22" width="8" height="28" rx="3" fill="#22d3ee" opacity="0.85"/>
</svg>
